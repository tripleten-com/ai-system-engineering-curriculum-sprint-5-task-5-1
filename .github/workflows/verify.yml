# Coldline - Task 5.1
# File: .github/workflows/verify.yml
# Component: Project CI
# Purpose: Run `poe verify` and the secret scan on every pull request in your Project 5 repository.
# Interacts With: uv, Poe, Docker Compose, Gitleaks, .gitleaks.toml, tests/security/runtime_logs.py
# Sprint/Task: Sprint 5 - Project 5 / starter (Task 5.1)
# Concepts: One check for every Task, the same command locally and in CI, logs that never carry a key
# Tools: GitHub Actions

# Keep this file exactly as supplied: the checks fail if it changes.
name: Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the pull request head
        # actions/checkout v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python 3.12
        # actions/setup-python v6.0.0
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - name: Install pinned tooling
        run: |
          python infra/scripts/bootstrap.py
          python infra/scripts/preflight.py
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
          .tools/bin/uv sync --frozen
      # Registry pulls are the one network-dependent part of startup, so they are retried
      # with backoff here; `poe start` inside `poe verify` then finds every image present.
      - name: Pull and build the pinned images
        run: |
          compose="docker compose --profile observability --profile localstack"
          for attempt in 1 2 3 4; do
            if $compose pull --quiet --ignore-buildable && $compose build; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "::warning::image pull or build attempt $attempt failed; retrying in $((attempt * 15))s"
              sleep $((attempt * 15))
            fi
          done
          echo "::error::image pull or build failed after 4 attempts"
          exit 1
      - name: poe verify
        run: .tools/bin/uv run --frozen poe verify
      # On failure or cancellation, before `poe reset` removes the containers. The logs are
      # never printed raw: `poe runtime-logs` replaces every stored key value before printing.
      - name: Show the runtime logs on failure
        if: failure() || cancelled()
        run: |
          if [ ! -x .tools/bin/uv ]; then
            echo "The pinned tooling was not installed; no runtime logs to show."
            exit 0
          fi
          .tools/bin/uv run --frozen poe runtime-logs || true
      - name: Stop the runtime
        if: always()
        run: .tools/bin/uv run --frozen poe reset

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the pull request head with its history
        # actions/checkout v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      # Gitleaks v8.30.1, pinned by digest (security/scanners.yaml), over the commits this
      # pull request adds, with the repository's .gitleaks.toml.
      - name: Scan the pull request's commits for secrets
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          docker run --rm --network none -v "$PWD:/scan" -w /scan \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /scan --config /scan/.gitleaks.toml --redact --exit-code 1 --ignore-gitleaks-allow \
            --log-opts="FETCH_HEAD..HEAD"
